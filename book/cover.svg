<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c"/>
      <stop offset="100%" style="stop-color:#0d1f33"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <!-- Email icon (simplified envelope) -->
  <rect x="400" y="350" width="400" height="280" rx="20" ry="20" fill="none" stroke="#4a9eff" stroke-width="6"/>
  <polyline points="400,380 600,520 800,380" fill="none" stroke="#4a9eff" stroke-width="6" stroke-linejoin="round"/>
  <!-- Shield overlay -->
  <path d="M600,480 L500,530 L500,650 Q500,750 600,800 Q700,750 700,650 L700,530 Z" fill="none" stroke="#00d4aa" stroke-width="5" opacity="0.8"/>
  <text x="600" y="780" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#00d4aa" opacity="0.8">🔒</text>
  <!-- Title -->
  <text x="600" y="950" text-anchor="middle" font-family="Noto Serif CJK SC, serif" font-size="48" font-weight="bold" fill="#ffffff">邮件系统安全加固</text>
  <text x="600" y="1020" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#7eb8ff">从 SMTP 协议到国密与高可用架构</text>
  <line x1="350" y1="1060" x2="850" y2="1060" stroke="#4a9eff" stroke-width="2" opacity="0.5"/>
  <text x="600" y="1150" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#aac8ff">Modern Enterprise Email &amp; Collaboration</text>
